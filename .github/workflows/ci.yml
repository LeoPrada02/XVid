# Every push and pull request: the PC app's tests, and the phone app's tests, lint and debug build.
# Releases are a separate workflow (release.yml).
name: CI

on:
  push:
  pull_request:

jobs:
  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest

  phone:
    # Pinned like release.yml: the build relies on the Android SDK that comes with this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint and build
        working-directory: android
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug
